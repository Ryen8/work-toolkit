<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Work Toolkit · 云端上传测试</title><style>body{margin:0;background:#f3f6fa;color:#17243b;font:15px system-ui,-apple-system,'Segoe UI',sans-serif}.wrap{max-width:650px;margin:40px auto;padding:0 18px}.card{background:white;border:1px solid #e1e7f0;border-radius:16px;padding:24px;box-shadow:0 5px 18px #17243b0b}h1{font-size:24px;margin:0 0 10px}p{line-height:1.6;color:#53647d}.field{margin:20px 0}label{display:block;font-weight:600;margin-bottom:8px}input,select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cbd5e1;border-radius:9px;background:white;font:inherit}button{background:#2563eb;color:white;border:0;border-radius:9px;padding:12px 20px;font-weight:600;cursor:pointer}button:disabled{background:#94a3b8;cursor:not-allowed}.status{white-space:pre-wrap;overflow-wrap:anywhere;background:#f1f5f9;border-radius:9px;padding:14px;margin-top:16px}.note{font-size:13px;color:#64748b}.verify{min-height:66px;margin:16px 0}.error{color:#b91c1c}.ok{color:#047857}</style><script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script></head><body><main class="wrap"><div class="card"><h1>云端文件上传测试</h1><p>这是独立测试页面，不会更改现有工具。仅使用非敏感测试文件。文件上传后将存入 Supabase 私有 Bucket。</p><div class="field"><label for="sitekey">Cloudflare Turnstile Site key（公开站点密钥）</label><input id="sitekey" placeholder="粘贴 Site key（不要填写 Secret key）" autocomplete="off"><div class="note">仅用于本页验证，不会保存到浏览器存储。</div></div><div class="field"><label for="tool">测试工具名称</label><select id="tool"><option value="upload-test">upload-test</option><option value="package-matcher">package-matcher</option><option value="dewu-pdf-matcher">dewu-pdf-matcher</option></select></div><div class="field"><label for="file">选择测试文件（PDF / XLSX / XLS / CSV / ZIP，最大 20 MB）</label><input id="file" type="file" accept=".pdf,.xlsx,.xls,.csv,.zip"></div><button type="button" id="start">加载人机验证</button><div id="verify" class="verify"></div><button type="button" id="upload" disabled>确认上传测试文件</button><div class="status" id="status" role="status" aria-live="polite">等待加载人机验证。</div><p class="note">安全提示：不要将 Turnstile Secret key、Supabase Secret key、数据库密码粘贴到本页。此测试页不应上传真实客户或订单资料。</p></div></main><script>
(()=>{'use strict';
const endpoint='https://arbkopmhwasqdcriuswz.supabase.co/functions/v1/upload-toolkit-file';
const $=id=>document.getElementById(id);let widgetId=null;let busy=false;
function show(s,cls=''){ $('status').textContent=s;$('status').className='status '+cls;}
function setReady(){ $('upload').disabled=busy||widgetId===null||!$('file').files.length; }
$('file').addEventListener('change',setReady);
$('start').addEventListener('click',()=>{const key=$('sitekey').value.trim();if(!key){show('请先填写公开 Site key。','error');return;}if(!window.turnstile){show('Turnstile 脚本尚未加载，请稍等后重试。','error');return;}if(widgetId!==null){try{window.turnstile.remove(widgetId);}catch{}widgetId=null;}
$('verify').replaceChildren();try{widgetId=window.turnstile.render('#verify',{sitekey:key,theme:'auto',callback:()=>show('人机验证完成。请选择文件并点击确认上传。','ok'),'expired-callback':()=>show('验证已过期，请重新完成验证。'),'error-callback':()=>show('验证组件出错，请检查 Site key 与域名配置。','error')});show('请完成人机验证，然后选择文件。');setReady();}catch(e){show('无法加载验证组件：'+String(e),'error');}});
$('upload').addEventListener('click',async()=>{if(busy)return;const file=$('file').files[0];if(!file||widgetId===null){show('请先选择文件并加载验证。','error');return;}if(file.size>20*1024*1024||file.size===0){show('文件必须大于 0 且不超过 20 MB。','error');return;}const token=window.turnstile?.getResponse(widgetId);if(!token){show('请先完成人机验证。','error');return;}if(!confirm('确认将测试文件「'+file.name+'」上传到私有云端空间？'))return;busy=true;setReady();show('正在上传，请稍候……');try{const fd=new FormData();fd.append('file',file,file.name);fd.append('turnstileToken',token);fd.append('tool',$('tool').value);const res=await fetch(endpoint,{method:'POST',body:fd,cache:'no-store'});const raw=await res.text();let result;try{result=JSON.parse(raw)}catch{result={error:raw.slice(0,500)}}if(res.ok&&result.success){show('上传成功！\n存储路径：'+result.path+'\n原始文件名：'+result.originalName+'\n大小：'+result.size+' bytes','ok');}else{show('上传失败（HTTP '+res.status+'）\n'+(result.error||JSON.stringify(result)),'error');}}catch(e){show('请求失败：'+String(e)+'\n请检查网络、浏览器控制台和 CORS 设置。','error');}finally{busy=false;try{window.turnstile?.reset(widgetId)}catch{}setReady();}});
})();
</script></body></html>
