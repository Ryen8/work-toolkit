<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>文件管理 · Liwus Work Toolkit</title>
<style>
:root{font-family:Inter,"Microsoft YaHei",Arial,sans-serif;color:#243247;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #e4e9f0;padding:19px max(18px,calc((100vw - 1150px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px}header strong{font-size:22px}a{color:#2563eb;text-decoration:none}main{max-width:1150px;margin:30px auto;padding:0 18px}.card{background:#fff;border:1px solid #e1e7ef;border-radius:14px;padding:24px;margin-bottom:20px;box-shadow:0 3px 14px #1e293b06}h1{font-size:25px;margin:0 0 8px}h2{font-size:18px;margin:0 0 18px}p{line-height:1.6}.muted{color:#66768c;font-size:14px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}label{display:block;font-size:14px;font-weight:600;margin:16px 0 7px}input{border:1px solid #ccd6e2;border-radius:8px;padding:12px;font-size:15px;max-width:100%;width:390px}input:focus{outline:2px solid #a6c8ff;border-color:#2563eb}button{border:0;border-radius:8px;padding:11px 16px;font-size:14px;font-weight:600;cursor:pointer;background:#2563eb;color:white}button:hover:not(:disabled){filter:brightness(.95)}button:disabled{opacity:.5;cursor:not-allowed}.secondary{background:#e8edf5;color:#243247}.green{background:#0e9f6e}.danger{background:#d93645}.small{padding:7px 12px;font-size:13px}.status{padding:12px 14px;border-radius:8px;background:#edf4ff;color:#174ea6;font-size:14px;margin:16px 0;white-space:pre-wrap;overflow-wrap:anywhere}.status.error{background:#fff0f0;color:#b42318}.hidden{display:none!important}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:13px 11px;border-bottom:1px solid #e8edf4}th{color:#526277;background:#f8fafc}td.path{overflow-wrap:anywhere;min-width:250px}td.actions{white-space:nowrap}.pill{background:#e6f7ef;color:#0b7950;border-radius:50px;padding:5px 10px;font-size:12px}.summary{margin:12px 0;color:#65738a;font-size:13px}.foot{font-size:12px;color:#66768c;margin:20px 0}.empty{text-align:center;padding:28px;color:#66768c}#signedInEmail{font-size:13px;color:#526277}@media(max-width:600px){header strong{font-size:17px}.card{padding:17px}button{padding:10px 12px}input{width:100%}}
</style>
</head>
<body>
<header><strong>📁 Liwus Work Toolkit · 文件管理</strong><a href="./index.html">← 返回工具首页</a></header>
<main>
<section class="card"><h1>文件管理中心</h1><p class="muted">仅限授权管理人员。使用各自的邮箱登录，可查看、下载和删除已上传文件。</p><div id="configNotice" class="status error hidden"></div></section>
<section id="loginPanel" class="card hidden"><h2>管理员邮箱登录</h2><p class="muted">输入已被邀请、且已加入 toolkit_admins 权限表的邮箱。系统会发送一次性验证码。</p><form id="sendForm"><label for="email">邮箱地址</label><div class="row"><input id="email" type="email" autocomplete="email" placeholder="name@company.de" required><button id="sendBtn" type="submit">发送验证码</button></div></form><form id="verifyForm" class="hidden"><label for="otp">邮件中的 8 位验证码</label><div class="row"><input id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="12" placeholder="请输入验证码" required><button id="verifyBtn" type="submit">验证并登录</button></div></form><div id="loginStatus" class="status hidden" role="status"></div></section>
<section id="filesPanel" class="card hidden"><div class="row between"><div><h2 style="margin-bottom:5px">已上传文件</h2><span id="signedInEmail"></span></div><div class="row"><button id="refreshBtn" class="secondary">刷新列表</button><button id="logoutBtn" class="secondary">退出登录</button></div></div><div id="fileStatus" class="status hidden" role="status"></div><div class="summary" id="fileCount"></div><div class="tablewrap"><table><thead><tr><th>文件名</th><th>存储路径</th><th>大小</th><th>上传日期</th><th>操作</th></tr></thead><tbody id="fileRows"></tbody></table></div><div id="empty" class="empty hidden">暂无文件</div></section>
<p class="foot">安全提示：下载链接仅短时间有效；删除操作不可撤销，请确认后再执行。请勿将 Supabase Secret Key 或 Service Role Key 放入此 HTML 文件。</p>
</main>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

// ===== 仅需填写下面两个公开配置项 =====
const SUPABASE_URL = 'https://arbkopmhwasqdcriuswz.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable__z1c0Cct_1y0E-deI4yXtA_T2WM7-6u';
// ======================================
const FUNCTION_URL = `${SUPABASE_URL}/functions/v1/manage-toolkit-files`;
const $ = id => document.getElementById(id);
let supabase, currentUser = null, busy = false;
const isConfigured = SUPABASE_URL.startsWith('https://') && !SUPABASE_PUBLISHABLE_KEY.includes('PASTE_');
function status(id, msg='', error=false){const el=$(id);el.textContent=msg;el.classList.toggle('hidden',!msg);el.classList.toggle('error',error)}
function size(n){if(n==null||!Number.isFinite(Number(n)))return '—';let v=Number(n);for(const unit of ['B','KB','MB','GB']){if(v<1024||unit==='GB')return `${v.toFixed(unit==='B'?0:1)} ${unit}`;v/=1024}}
function date(s){if(!s)return '—';const d=new Date(s);return Number.isNaN(d.getTime())?'—':d.toLocaleString('zh-CN',{hour12:false})}
function showLoggedIn(user){currentUser=user;$('loginPanel').classList.toggle('hidden',!!user);$('filesPanel').classList.toggle('hidden',!user);$('signedInEmail').textContent=user?.email||''}
function buttonBusy(id,on){$(id).disabled=on}
async function request(action,path){const {data:{session},error}=await supabase.auth.getSession();if(error||!session?.access_token)throw new Error('登录已过期，请退出后重新登录');const res=await fetch(FUNCTION_URL,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${session.access_token}`,'apikey':SUPABASE_PUBLISHABLE_KEY},body:JSON.stringify(path?{action,path}:{action}),cache:'no-store'});let data;try{data=await res.json()}catch{throw new Error(`服务器返回异常（HTTP ${res.status}）`)}if(!res.ok||data?.success!==true)throw new Error(`${data?.error||'操作失败'}（HTTP ${res.status}）`);return data}
function td(tr,text,cls=''){const el=document.createElement('td');el.textContent=text;el.className=cls;tr.append(el);return el}
async function refresh(){if(busy)return;busy=true;buttonBusy('refreshBtn',true);status('fileStatus','正在读取文件列表…');$('fileRows').replaceChildren();$('empty').classList.add('hidden');$('fileCount').textContent='';try{const data=await request('list');const files=Array.isArray(data.files)?data.files:[];files.sort((a,b)=>String(b.created_at||'').localeCompare(String(a.created_at||'')));$('fileCount').textContent=`共 ${files.length} 个文件`;$('empty').classList.toggle('hidden',files.length>0);const frag=document.createDocumentFragment();for(const f of files){const tr=document.createElement('tr');td(tr,f.name||'—');td(tr,f.path||'—','path');td(tr,size(f.size));td(tr,date(f.created_at));const action=td(tr,'','actions');const download=document.createElement('button');download.textContent='下载';download.className='green small';download.addEventListener('click',async()=>{download.disabled=true;status('fileStatus','正在生成临时下载链接…');try{const result=await request('download',f.path);const link=document.createElement('a');link.href=result.url;link.target='_blank';link.rel='noopener noreferrer';document.body.append(link);link.click();link.remove();status('fileStatus','下载链接已打开。如浏览器未直接保存文件，请在打开的页面中下载。')}catch(e){status('fileStatus',e.message,true)}finally{download.disabled=false}});const del=document.createElement('button');del.textContent='删除';del.className='danger small';del.style.marginLeft='7px';del.addEventListener('click',async()=>{if(!confirm(`确定永久删除以下文件？\n\n${f.path}\n\n删除后无法恢复。`))return;del.disabled=true;download.disabled=true;status('fileStatus','正在删除文件…');try{await request('delete',f.path);status('fileStatus','文件已删除。');await refreshAfterDelete()}catch(e){status('fileStatus',e.message,true);del.disabled=false;download.disabled=false}});action.append(download,del);frag.append(tr)}$('fileRows').append(frag);status('fileStatus','')}catch(e){status('fileStatus',e.message,true)}finally{busy=false;buttonBusy('refreshBtn',false)}}
async function refreshAfterDelete(){busy=false;await refresh()}
$('sendForm').addEventListener('submit',async e=>{e.preventDefault();buttonBusy('sendBtn',true);status('loginStatus','正在发送验证码…');try{const email=$('email').value.trim();const {error}=await supabase.auth.signInWithOtp({email,options:{shouldCreateUser:false}});if(error)throw error;$('verifyForm').classList.remove('hidden');status('loginStatus','如邮箱已获授权，验证码将发送到该邮箱。请检查收件箱和垃圾邮件。')}catch(err){status('loginStatus',err.message,true)}finally{buttonBusy('sendBtn',false)}});
$('verifyForm').addEventListener('submit',async e=>{e.preventDefault();buttonBusy('verifyBtn',true);status('loginStatus','正在验证…');try{const {data,error}=await supabase.auth.verifyOtp({email:$('email').value.trim(),token:$('otp').value.trim(),type:'email'});if(error)throw error;if(!data?.user)throw new Error('验证失败');showLoggedIn(data.user);await refresh()}catch(err){status('loginStatus',err.message,true)}finally{buttonBusy('verifyBtn',false)}});
$('refreshBtn').addEventListener('click',refresh);
$('logoutBtn').addEventListener('click',async()=>{await supabase.auth.signOut();showLoggedIn(null);$('otp').value='';$('verifyForm').classList.add('hidden');status('loginStatus','已退出登录')});
async function init(){if(!isConfigured){$('configNotice').classList.remove('hidden');$('configNotice').textContent='尚未配置 Supabase Publishable Key。请编辑 admin.html 中的 SUPABASE_PUBLISHABLE_KEY 后再上传 GitHub。';return}try{supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const {data:{user},error}=await supabase.auth.getUser();if(error||!user){showLoggedIn(null)}else{showLoggedIn(user);await refresh()}}catch(e){showLoggedIn(null);status('loginStatus',e.message,true)}}
init();
</script>
</body></html>
