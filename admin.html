<style>
:root{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI","Microsoft YaHei","Microsoft JhengHei",sans-serif;color:#1e293b;background:#f1f5f9}*{box-sizing:border-box}body{margin:0;font-size:14px;line-height:1.55}a{color:#2563eb;text-decoration:none}main{max-width:1150px;margin:0 auto;padding:20px 18px 36px}.toolkit-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}.toolkit-nav-left{display:flex;align-items:center;gap:8px}.toolkit-nav-globe{font-size:16px}.toolkit-nav-select,.toolkit-nav-back{height:38px;min-height:38px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:#334155;font:600 14px/20px inherit;padding:7px 10px;box-shadow:none}.toolkit-nav-select{min-width:102px;cursor:pointer}.toolkit-nav-back{display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;padding:8px 12px;font-weight:600}.toolkit-nav-back:hover{background:#f8fafc;border-color:#94a3b8}.page-title{font-size:25px;font-weight:700;color:#0f172a;margin:0 0 6px;line-height:1.3}.page-sub{margin:0 0 24px;color:#64748b;font-size:14px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:15px;padding:22px;margin-bottom:20px;box-shadow:0 2px 8px #0f172a08}h2{font-size:17px;line-height:1.45;font-weight:700;margin:0 0 14px;color:#1e293b}p{line-height:1.6}.muted{color:#64748b;font-size:14px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}label{display:block;font-size:14px;font-weight:600;margin:16px 0 7px}input{border:1px solid #cbd5e1;border-radius:9px;padding:11px 12px;font-size:14px;max-width:100%;width:390px}input:focus,button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #2563eb;outline-offset:2px}button{border:0;border-radius:9px;padding:11px 16px;font-size:14px;font-weight:650;cursor:pointer;background:#2563eb;color:white}button:hover:not(:disabled){filter:brightness(.95)}button:disabled{opacity:.6;cursor:not-allowed}.secondary{background:#e2e8f0;color:#1e293b}.green{background:#059669}.danger{background:#dc2626}.small{padding:7px 12px;font-size:13px}.status{padding:12px 14px;border-radius:9px;background:#eff6ff;color:#1d4ed8;font-size:14px;margin:16px 0;white-space:pre-wrap;overflow-wrap:anywhere}.status.error{background:#fef2f2;color:#b91c1c}.hidden{display:none!important}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:13px 11px;border-bottom:1px solid #e2e8f0}th{color:#334155;background:#f8fafc}td.path{overflow-wrap:anywhere;min-width:250px}td.actions{white-space:nowrap}.summary{margin:12px 0;color:#64748b;font-size:13px}.foot{font-size:12px;color:#64748b;margin:20px 0}.empty{text-align:center;padding:28px;color:#64748b}#signedInEmail{font-size:13px;color:#64748b}@media(max-width:600px){main{padding:16px}.card{padding:16px}.page-title{font-size:22px}button{padding:10px 12px}input{width:100%}}

<body>
<main>
<nav class="toolkit-nav" aria-label="Tool navigation"><div class="toolkit-nav-left"><span class="toolkit-nav-globe" aria-hidden="true">🌐</span><label for="language-select" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)">Language / Sprache</label><select id="language-select" class="toolkit-nav-select" aria-label="Language / Sprache"><option value="zh-CN">简体中文</option><option value="zh">繁體中文</option><option value="en">English</option><option value="de">Deutsch</option></select></div><a class="toolkit-nav-back" href="./index.html" data-i18n="back">← 返回工具列表</a></nav>
<h1 class="page-title" data-i18n="title">📁 文件管理中心</h1><p class="page-sub" data-i18n="subtitle">仅限授权管理人员。使用各自的邮箱登录，可查看、下载和删除已上传文件。</p><div id="configNotice" class="status error hidden"></div>
<section id="loginPanel" class="card hidden"><h2 data-i18n="login">管理员邮箱登录</h2><p class="muted" data-i18n="loginHint">输入已被邀请且已加入 toolkit_admins 权限表的邮箱。系统会发送一次性登录链接，点击邮件中的 Sign in 即可返回本页面。</p><form id="sendForm"><label for="email" data-i18n="email">邮箱地址</label><div class="row"><input id="email" type="email" autocomplete="email" placeholder="name@company.de" required><button id="sendBtn" type="submit" data-i18n="send">发送登录链接</button></div></form><div id="loginStatus" class="status hidden" role="status"></div></section>
<section id="filesPanel" class="card hidden"><div class="row between"><div><h2 style="margin-bottom:5px" data-i18n="files">已上传文件</h2><span id="signedInEmail"></span></div><div class="row"><button id="refreshBtn" class="secondary" data-i18n="refresh">刷新列表</button><button id="logoutBtn" class="secondary" data-i18n="logout">退出登录</button></div></div><div id="fileStatus" class="status hidden" role="status"></div><div class="summary" id="fileCount"></div><div class="tablewrap"><table><thead><tr><th data-i18n="filename">文件名</th><th data-i18n="path">存储路径</th><th data-i18n="size">大小</th><th data-i18n="date">上传日期</th><th data-i18n="actions">操作</th></tr></thead><tbody id="fileRows"></tbody></table></div><div id="empty" class="empty hidden" data-i18n="empty">暂无文件</div></section>
<p class="foot" data-i18n="foot">安全提示：下载链接仅短时间有效；删除操作不可撤销，请确认后再执行。请勿将 Supabase Secret Key 或 Service Role Key 放入此 HTML 文件。</p>
</main>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

// ===== 仅需填写下面两个公开配置项 =====
const SUPABASE_URL = 'https://arbkopmhwasqdcriuswz.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable__z1c0Cct_1y0E-deI4yXtA_T2WM7-6u';
// ======================================
const LANG = {
'zh-CN':{back:'← 返回工具列表',title:'📁 文件管理中心',subtitle:'仅限授权管理人员。使用各自的邮箱登录，可查看、下载和删除已上传文件。',login:'管理员邮箱登录',loginHint:'输入已被邀请且已加入 toolkit_admins 权限表的邮箱。系统会发送一次性登录链接，点击邮件中的 Sign in 即可返回本页面。',email:'邮箱地址',send:'发送登录链接',files:'已上传文件',refresh:'刷新列表',logout:'退出登录',filename:'文件名',path:'存储路径',size:'大小',date:'上传日期',actions:'操作',empty:'暂无文件',foot:'安全提示：下载链接仅短时间有效；删除操作不可撤销，请确认后再执行。请勿将 Supabase Secret Key 或 Service Role Key 放入此 HTML 文件。',total:n=>`共 ${n} 个文件`,loading:'正在读取文件列表…',download:'下载',delete:'删除',generating:'正在生成临时下载链接…',opened:'已请求下载文件，请查看浏览器下载记录。',confirm:p=>`确定永久删除以下文件？\n\n${p}\n\n删除后无法恢复。`,deleting:'正在删除文件…',deleted:'文件已删除。',sending:'正在发送登录链接…',sent:'如果该邮箱已被邀请，登录链接将发送到邮箱。请打开最新邮件，点击 Sign in 返回此页面。',signedout:'已退出登录',expired:'登录已过期，请退出后重新登录',server:s=>`服务器返回异常（HTTP ${s}）`,failed:'操作失败',config:'尚未配置 Supabase Publishable Key。',invalid:'登录链接无效或已过期，请重新发送。'},
'zh':{back:'← 返回工具列表',title:'📁 文件管理中心',subtitle:'僅限授權管理人員。使用各自的電子郵件登入，可查看、下載和刪除已上傳檔案。',login:'管理員電子郵件登入',loginHint:'輸入已受邀且已加入 toolkit_admins 權限表的電子郵件。系統會傳送一次性登入連結，點擊郵件中的 Sign in 即可返回本頁。',email:'電子郵件地址',send:'傳送登入連結',files:'已上傳檔案',refresh:'重新整理',logout:'登出',filename:'檔案名稱',path:'儲存路徑',size:'大小',date:'上傳日期',actions:'操作',empty:'暫無檔案',foot:'安全提示：下載連結僅短時間有效；刪除操作無法復原。請勿將 Supabase Secret Key 或 Service Role Key 放入 HTML。',total:n=>`共 ${n} 個檔案`,loading:'正在讀取檔案清單…',download:'下載',delete:'刪除',generating:'正在產生臨時下載連結…',opened:'已要求下載檔案，請查看瀏覽器下載記錄。',confirm:p=>`確定永久刪除以下檔案？\n\n${p}\n\n刪除後無法復原。`,deleting:'正在刪除檔案…',deleted:'檔案已刪除。',sending:'正在傳送登入連結…',sent:'若此電子郵件已受邀，登入連結將傳送至信箱。請點擊最新郵件中的 Sign in。',signedout:'已登出',expired:'登入已過期，請重新登入',server:s=>`伺服器回應異常（HTTP ${s}）`,failed:'操作失敗',config:'尚未設定 Supabase Publishable Key。',invalid:'登入連結無效或已過期，請重新傳送。'},
'en':{back:'← Back to tools',title:'📁 File Management Center',subtitle:'Authorized managers only. Sign in with your own email to view, download and delete uploaded files.',login:'Administrator email sign-in',loginHint:'Enter an invited email address that is included in toolkit_admins. A one-time sign-in link will be emailed to you. Click Sign in to return here.',email:'Email address',send:'Send sign-in link',files:'Uploaded files',refresh:'Refresh list',logout:'Sign out',filename:'File name',path:'Storage path',size:'Size',date:'Upload date',actions:'Actions',empty:'No files yet',foot:'Security: Download links expire shortly. Deletions cannot be undone. Never include a Supabase Secret Key or Service Role Key in HTML.',total:n=>`${n} files`,loading:'Loading file list…',download:'Download',delete:'Delete',generating:'Creating temporary download link…',opened:'File download requested. Check your browser downloads.',confirm:p=>`Permanently delete this file?\n\n${p}\n\nThis cannot be undone.`,deleting:'Deleting file…',deleted:'File deleted.',sending:'Sending sign-in link…',sent:'If this email has been invited, a sign-in link will arrive shortly. Open the newest email and click Sign in.',signedout:'Signed out',expired:'Session expired. Please sign in again.',server:s=>`Unexpected server response (HTTP ${s})`,failed:'Operation failed',config:'Supabase Publishable Key is not configured.',invalid:'Sign-in link is invalid or expired. Request another one.'},
'de':{back:'← Zurück zur Werkzeugliste',title:'📁 Dateiverwaltung',subtitle:'Nur für autorisierte Personen. Melden Sie sich mit Ihrer eigenen E-Mail-Adresse an, um hochgeladene Dateien anzuzeigen, herunterzuladen oder zu löschen.',login:'Administrator-Anmeldung per E-Mail',loginHint:'Geben Sie eine eingeladene E-Mail-Adresse ein, die in toolkit_admins eingetragen ist. Sie erhalten einen einmaligen Anmeldelink. Klicken Sie in der E-Mail auf Sign in.',email:'E-Mail-Adresse',send:'Anmeldelink senden',files:'Hochgeladene Dateien',refresh:'Liste aktualisieren',logout:'Abmelden',filename:'Dateiname',path:'Speicherpfad',size:'Größe',date:'Upload-Datum',actions:'Aktionen',empty:'Keine Dateien vorhanden',foot:'Sicherheit: Downloadlinks sind nur kurz gültig. Löschvorgänge können nicht rückgängig gemacht werden. Keine Supabase Secret Keys oder Service Role Keys in HTML einfügen.',total:n=>`${n} Dateien`,loading:'Dateiliste wird geladen…',download:'Herunterladen',delete:'Löschen',generating:'Temporärer Downloadlink wird erstellt…',opened:'Dateidownload angefordert. Bitte prüfen Sie Ihre Browser-Downloads.',confirm:p=>`Diese Datei endgültig löschen?\n\n${p}\n\nDies kann nicht rückgängig gemacht werden.`,deleting:'Datei wird gelöscht…',deleted:'Datei gelöscht.',sending:'Anmeldelink wird gesendet…',sent:'Falls diese E-Mail-Adresse eingeladen wurde, wird ein Anmeldelink gesendet. Öffnen Sie die neueste E-Mail und klicken Sie auf Sign in.',signedout:'Abgemeldet',expired:'Sitzung abgelaufen. Bitte erneut anmelden.',server:s=>`Unerwartete Serverantwort (HTTP ${s})`,failed:'Aktion fehlgeschlagen',config:'Supabase Publishable Key ist noch nicht konfiguriert.',invalid:'Anmeldelink ungültig oder abgelaufen. Bitte neuen Link anfordern.'}
};
let language = localStorage.getItem('liwus-language') || localStorage.getItem('toolkit-language') || 'zh-CN';
if(language==='zh-TW') language='zh';
if(!LANG[language]) language='zh-CN';
const t=(key,...args)=>{const v=(LANG[language]||LANG['zh-CN'])[key];return typeof v==='function'?v(...args):(v??key)};
function setLanguage(lang){language=LANG[lang]?lang:'zh-CN';localStorage.setItem('liwus-language',language);document.documentElement.lang=language==='zh'?'zh-TW':language;document.getElementById('language-select').value=language;document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));if(currentUser&&Array.isArray(lastFiles))renderFiles(lastFiles)}
const FUNCTION_URL = `${SUPABASE_URL}/functions/v1/manage-toolkit-files`;
const $ = id => document.getElementById(id);
let supabase, currentUser = null, busy = false; let lastFiles = [];
const isConfigured = SUPABASE_URL.startsWith('https://') && !SUPABASE_PUBLISHABLE_KEY.includes('PASTE_');
function status(id, msg='', error=false){const el=$(id);el.textContent=msg;el.classList.toggle('hidden',!msg);el.classList.toggle('error',error)}
function size(n){if(n==null||!Number.isFinite(Number(n)))return '—';let v=Number(n);for(const unit of ['B','KB','MB','GB']){if(v<1024||unit==='GB')return `${v.toFixed(unit==='B'?0:1)} ${unit}`;v/=1024}}
function date(s){if(!s)return '—';const d=new Date(s);return Number.isNaN(d.getTime())?'—':d.toLocaleString('zh-CN',{hour12:false})}
function showLoggedIn(user){currentUser=user;$('loginPanel').classList.toggle('hidden',!!user);$('filesPanel').classList.toggle('hidden',!user);$('signedInEmail').textContent=user?.email||''}
function buttonBusy(id,on){$(id).disabled=on}
async function request(action,path){const {data:{session},error}=await supabase.auth.getSession();if(error||!session?.access_token)throw new Error(t('expired'));const res=await fetch(FUNCTION_URL,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${session.access_token}`,'apikey':SUPABASE_PUBLISHABLE_KEY},body:JSON.stringify(path?{action,path}:{action}),cache:'no-store'});let data;try{data=await res.json()}catch{throw new Error(t('server',res.status))}if(!res.ok||data?.success!==true)throw new Error(`${data?.error||t('failed')}（HTTP ${res.status}）`);return data}
function td(tr,text,cls=''){const el=document.createElement('td');el.textContent=text;el.className=cls;tr.append(el);return el}
function renderFiles(files){$('fileRows').replaceChildren();$('fileCount').textContent=t('total',files.length);$('empty').classList.toggle('hidden',files.length>0);const frag=document.createDocumentFragment();for(const f of files){const tr=document.createElement('tr');td(tr,f.name||'—');td(tr,f.path||'—','path');td(tr,size(f.size));td(tr,date(f.created_at));const action=td(tr,'','actions');const download=document.createElement('button');download.textContent=t('download');download.className='green small';download.addEventListener('click',async()=>{download.disabled=true;status('fileStatus',t('generating'));try{const result=await request('download',f.path);// Supabase Storage honors the `download` query parameter and returns
// Content-Disposition: attachment, including for browser-displayable TXT/PDF.
// This avoids cross-origin Blob fetches and preserves the signed URL token.
const signedUrl=new URL(result.url);
const filename=String(f.name||f.path.split('/').pop()||'download');
signedUrl.searchParams.set('download',filename);
const link=document.createElement('a');
link.href=signedUrl.toString();
link.download=filename;
link.rel='noopener noreferrer';
document.body.append(link);
link.click();
link.remove();
status('fileStatus',t('opened'))}catch(e){status('fileStatus',e.message,true)}finally{download.disabled=false}});const del=document.createElement('button');del.textContent=t('delete');del.className='danger small';del.style.marginLeft='7px';del.addEventListener('click',async()=>{if(!confirm(t('confirm',f.path)))return;del.disabled=true;download.disabled=true;status('fileStatus',t('deleting'));try{await request('delete',f.path);status('fileStatus',t('deleted'));await refreshAfterDelete()}catch(e){status('fileStatus',e.message,true);del.disabled=false;download.disabled=false}});action.append(download,del);frag.append(tr)}$('fileRows').append(frag)}
async function refresh(){if(busy)return;busy=true;buttonBusy('refreshBtn',true);status('fileStatus',t('loading'));$('fileRows').replaceChildren();$('empty').classList.add('hidden');$('fileCount').textContent='';try{const data=await request('list');const files=Array.isArray(data.files)?data.files:[];files.sort((a,b)=>String(b.created_at||'').localeCompare(String(a.created_at||'')));lastFiles=files;renderFiles(files);status('fileStatus','')}catch(e){status('fileStatus',e.message,true)}finally{busy=false;buttonBusy('refreshBtn',false)}}
async function refreshAfterDelete(){busy=false;await refresh()}
$('sendForm').addEventListener('submit',async e=>{e.preventDefault();buttonBusy('sendBtn',true);status('loginStatus',t('sending'));try{const email=$('email').value.trim();const {error}=await supabase.auth.signInWithOtp({email,options:{shouldCreateUser:false,emailRedirectTo:window.location.origin+window.location.pathname}});if(error)throw error;status('loginStatus',t('sent'))}catch(err){status('loginStatus',err.message,true)}finally{buttonBusy('sendBtn',false)}});
$('refreshBtn').addEventListener('click',refresh);
$('logoutBtn').addEventListener('click',async()=>{await supabase.auth.signOut();showLoggedIn(null);status('loginStatus',t('signedout'))});
async function init(){if(!isConfigured){$('configNotice').classList.remove('hidden');$('configNotice').textContent=t('config');return}try{supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const {data:{session},error:sessionError}=await supabase.auth.getSession();if(sessionError)throw sessionError;const {data:{user},error}=await supabase.auth.getUser();if(error||!user){showLoggedIn(null);if(window.location.hash.includes('error=')){const params=new URLSearchParams(window.location.hash.slice(1));status('loginStatus',params.get('error_description')||t('invalid'),true)}}else{showLoggedIn(user);await refresh()}}catch(e){showLoggedIn(null);status('loginStatus',e.message,true)}}
document.getElementById('language-select').addEventListener('change',e=>setLanguage(e.target.value));
setLanguage(language);
init();
</script>
