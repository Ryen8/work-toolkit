<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>倉庫裝箱掃描與單號比對系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS (xlsx) 用於讀取與匯出 Excel -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <!-- JSZip 用於將各箱 Excel 打包成 ZIP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <!-- html2pdf.js 用於將現有報表直接生成 PDF 並加入 ZIP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- Html5-qrcode 用於相機條碼掃描 -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        .scanner-container { position: relative; width: 100%; max-width: 500px; margin: 0 auto; }
        #reader { width: 100% !important; border: none !important; border-radius: 0.75rem; overflow: hidden; }
        #reader__dashboard_section_csr button {
            background-color: #2563eb !important;
            color: white !important;
            padding: 6px 14px !important;
            border-radius: 0.5rem !important;
            border: none !important;
            font-weight: 600;
        }
        /* 與 PDF LP 配對工具一致的白色卡片、淺灰背景及間距 */
        main > section { border-radius: 15px !important; padding: 22px !important; box-shadow: 0 2px 8px #0f172a08 !important; }
        main > section > h2, main > section > div > h2 { font-size: 17px; }
        /* 列印 / 匯出 PDF 專用樣式 (還原 PACKING & DISPATCH REPORT 格式) */
        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                padding: 0;
                margin: 0;
                background: white !important;
            }
            .no-print { display: none !important; }
            .page-break-avoid { break-inside: avoid; page-break-inside: avoid; }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-24">

    <!-- 與 PDF 工具一致的頂部導覽與標題 -->
    <div class="max-w-[920px] mx-auto px-4 pt-5 no-print">
        <nav class="flex items-center justify-between gap-3 flex-wrap mb-5" aria-label="Tool navigation">
            <div class="flex items-center gap-2">
                <span aria-hidden="true">🌐</span>
                <label class="sr-only" for="language-select">Language / Sprache</label>
                <select id="language-select" onchange="setLanguage(this.value)" aria-label="Language / Sprache" class="bg-white text-slate-800 border border-slate-300 rounded-lg px-3 py-2 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-blue-400 cursor-pointer">
                    <option value="zh">繁體中文</option>
                    <option value="en">English</option>
                    <option value="de">Deutsch</option>
                </select>
            </div>
            <a href="./index.html" id="back-to-tools" class="inline-flex items-center gap-1 bg-white hover:bg-slate-50 text-slate-700 border border-slate-300 rounded-lg px-3 py-2 text-sm font-semibold" aria-label="返回工具列表" title="返回工具列表">← <span>返回工具列表</span></a>
        </nav>
        <div class="flex items-start justify-between gap-3 flex-wrap mb-5">
            <div>
                <h1 class="text-2xl sm:text-[25px] font-bold text-slate-900 leading-tight"><span aria-hidden="true">📦 </span><span>裝箱掃描與單號比對系統</span></h1>
                <p class="text-sm text-slate-500 mt-2">Warehouse Box Scanner & Matcher</p>
            </div>
            <span id="header-stats" class="bg-white border border-slate-200 text-xs px-3 py-2 rounded-lg font-semibold text-blue-700">0 箱 / 0 件</span>
        </div>
    </div>

    <main class="max-w-[920px] mx-auto px-4 pb-8 space-y-4 no-print">

        <!-- 步驟 1：上傳 Excel 對照表 -->
        <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4">
            <div class="flex justify-between items-center mb-2.5">
                <h2 class="font-bold text-slate-800 text-sm flex items-center gap-2">
                    <span class="bg-blue-600 text-white w-5 h-5 rounded-full inline-flex items-center justify-center text-xs">1</span>
                    上傳單號對照表 (Excel)
                </h2>
                <span id="excel-status" class="text-xs font-medium text-slate-400">尚未載入對照表</span>
            </div>

            <label class="flex flex-col items-center justify-center w-full h-24 border-2 border-dashed border-slate-300 hover:border-blue-500 rounded-xl cursor-pointer bg-slate-50 hover:bg-blue-50/40 transition">
                <div class="flex flex-col items-center justify-center pt-2 pb-2 text-center px-4">
                    <i class="fa-solid fa-file-excel text-emerald-600 text-2xl mb-1"></i>
                    <p class="text-xs font-medium text-slate-700" id="file-name-display">點擊選擇或拖曳 Excel 檔案 (.xlsx / .xls / .csv)</p>
                    <p class="text-[11px] text-slate-400 mt-0.5">自動識別「指定运单号」與「系统履约单号」欄位</p>
                </div>
                <input id="excel-upload" type="file" accept=".xlsx,.xls,.csv" class="hidden" onchange="handleExcelUpload(event)" />
            </label>
        </section>

        <!-- 步驟 2：設定當前箱號與重量 -->
        <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 space-y-3">
            <div class="flex justify-between items-center">
                <h2 class="font-bold text-slate-800 text-sm flex items-center gap-2">
                    <span class="bg-blue-600 text-white w-5 h-5 rounded-full inline-flex items-center justify-center text-xs">2</span>
                    當前裝箱設定 & 掃描
                </h2>
                <button onclick="startNewBox()" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5">
                    <i class="fa-solid fa-box-open"></i> 封箱並開下一箱
                </button>
            </div>

            <!-- 箱名與重量設定列 -->
            <div class="grid grid-cols-2 gap-3 bg-slate-50 p-3 rounded-xl border border-slate-200/80">
                <div>
                    <label class="block text-[11px] font-semibold text-slate-500 mb-1">當前箱號名稱 (可自訂)</label>
                    <input type="text" id="current-box-name" value="BOX 001" oninput="updateCurrentBoxMeta()" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-slate-500 mb-1">本箱重量 (kg)</label>
                    <div class="relative">
                        <input type="number" id="current-box-weight" step="0.01" min="0" placeholder="0.00" oninput="updateCurrentBoxMeta()" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 pr-9 text-sm font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <span class="absolute right-3 top-2.5 text-xs text-slate-400 font-medium">kg</span>
                    </div>
                </div>
            </div>

            <!-- 相機掃描區塊 -->
            <div>
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs font-medium text-slate-600">條碼掃描輸入 (支援相機或藍牙掃描槍)</span>
                    <label class="inline-flex items-center gap-1.5 cursor-pointer">
                        <input type="checkbox" id="continuous-scan" checked class="w-3.5 h-3.5 text-blue-600 rounded">
                        <span class="text-xs text-slate-600">連續掃描不中斷</span>
                    </label>
                </div>

                <div id="scanner-wrapper" class="hidden mb-3">
                    <div class="scanner-container bg-slate-900 rounded-xl overflow-hidden">
                        <div id="reader"></div>
                    </div>
                    <button onclick="stopScanner()" class="mt-2 w-full bg-red-500 hover:bg-red-600 text-white py-2 rounded-xl text-xs font-semibold transition flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-stop"></i> 關閉相機
                    </button>
                </div>

                <div class="flex gap-2">
                    <button id="start-scan-btn" onclick="startScanner()" class="bg-blue-600 hover:bg-blue-700 active:scale-[0.99] text-white px-4 py-2.5 rounded-xl text-sm font-semibold shadow-sm transition flex items-center justify-center gap-2 shrink-0">
                        <i class="fa-solid fa-camera"></i> 開啟相機
                    </button>
                    <input type="text" id="barcode-input" placeholder="掃描或輸入指定運單號 (按 Enter 加入)" onkeydown="if(event.key==='Enter') processBarcode(this.value)" class="flex-1 bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white">
                    <button onclick="processBarcode(document.getElementById('barcode-input').value)" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-xl text-sm font-semibold transition shrink-0">
                        加入
                    </button>
                </div>
            </div>

            <!-- 即時比對狀態提示 -->
            <div id="scan-feedback" class="hidden px-3.5 py-2.5 rounded-xl text-xs font-medium flex items-center justify-between"></div>
        </section>

        <!-- 步驟 3：分箱明細預覽與管理 -->
        <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 space-y-3">
            <div class="flex justify-between items-center">
                <h2 class="font-bold text-slate-800 text-sm flex items-center gap-2">
                    <span class="bg-blue-600 text-white w-5 h-5 rounded-full inline-flex items-center justify-center text-xs">3</span>
                    已掃描分箱清單 (最新在最上方)
                </h2>
                <button onclick="clearAllData()" class="text-xs text-red-500 hover:text-red-700 font-medium">
                    <i class="fa-solid fa-trash-can"></i> 清空全部
                </button>
            </div>

            <div id="boxes-container" class="space-y-4">
                <!-- 動態產生各箱卡片 -->
            </div>
        </section>

        <!-- 步驟 4：報表標題設定與匯出 -->
        <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 space-y-3">
            <h2 class="font-bold text-slate-800 text-sm flex items-center gap-2">
                <span class="bg-blue-600 text-white w-5 h-5 rounded-full inline-flex items-center justify-center text-xs">4</span>
                統整匯出報表
            </h2>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-[11px] font-medium text-slate-500 mb-1">報表抬頭 / 客戶名稱</label>
                    <input type="text" id="report-brand" value="Liwu's" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-1.5 text-xs font-medium">
                </div>
                <div>
                    <label class="block text-[11px] font-medium text-slate-500 mb-1">副標題</label>
                    <input type="text" id="report-subtitle" value="Warehouse packed list" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-1.5 text-xs font-medium">
                </div>
            </div>

            <button id="export-all-btn" onclick="exportAllReportsZip()" class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white py-3 rounded-xl text-sm font-bold shadow-sm transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-file-zipper"></i> <span id="export-all-label" data-export-lang="button">一鍵打包下載全部報表（ZIP）</span>
            </button>
            <p id="export-all-description" data-export-lang="description" class="text-[11px] text-slate-500">一次下載：Excel 裝箱總表、PDF 裝箱報表，以及各箱獨立的 VO 相容 Excel（sheet1 / 系统履约单号）。空箱不匯出。</p>
        </section>

    </main>

    <!-- 隱藏的 PDF 列印專屬版面 -->
    <div id="print-area" class="hidden print:block p-8 font-sans text-slate-900 bg-white"></div>

    <script>

        // UI language is saved independently of the box data.
        const TRANSLATIONS = {"返回工具列表": ["Back to tools", "Zur Übersicht"],"裝箱掃描與單號比對系統": ["Packing Scanner & Order Matcher", "Packscanner & Auftragsabgleich"], "上傳單號對照表 (Excel)": ["Upload Order Mapping (Excel)", "Auftragszuordnung hochladen (Excel)"], "尚未載入對照表": ["No mapping loaded", "Keine Zuordnung geladen"], "點擊選擇或拖曳 Excel 檔案 (.xlsx / .xls / .csv)": ["Click or drag an Excel file (.xlsx / .xls / .csv)", "Excel-Datei auswählen oder hierher ziehen (.xlsx / .xls / .csv)"], "自動識別「指定运单号」與「系统履约单号」欄位": ["Automatically detects tracking and fulfillment number columns", "Erkennt Versand- und Fulfillmentnummern automatisch"], "當前裝箱設定 & 掃描": ["Current Box & Scanning", "Aktueller Karton & Scannen"], "封箱並開下一箱": ["Close Box & Open Next", "Karton schließen & nächsten öffnen"], "當前箱號名稱 (可自訂)": ["Current Box Name (editable)", "Kartonname (bearbeitbar)"], "本箱重量 (kg)": ["Box Weight (kg)", "Kartongewicht (kg)"], "條碼掃描輸入 (支援相機或藍牙掃描槍)": ["Barcode Input (camera or Bluetooth scanner)", "Barcode-Eingabe (Kamera oder Bluetooth-Scanner)"], "連續掃描不中斷": ["Continuous Scanning", "Fortlaufend scannen"], "關閉相機": ["Stop Camera", "Kamera schließen"], "開啟相機": ["Open Camera", "Kamera öffnen"], "加入": ["Add", "Hinzufügen"], "已掃描分箱清單 (最新在最上方)": ["Scanned Boxes (newest first)", "Gescannte Kartons (neueste zuerst)"], "清空全部": ["Clear All", "Alles löschen"], "統整匯出報表": ["Export Reports", "Berichte exportieren"], "報表抬頭 / 客戶名稱": ["Report Header / Client", "Berichtskopf / Kunde"], "副標題": ["Subtitle", "Untertitel"], "匯出 Excel (.xlsx)": ["Export Excel (.xlsx)", "Excel exportieren (.xlsx)"], "生成 PDF 報表": ["Generate PDF Report", "PDF-Bericht erstellen"], "依箱號分別匯出 Excel（ZIP 打包）": ["Export Excel per Box (ZIP)", "Excel je Karton exportieren (ZIP)"], "每箱獨立一個 Excel，只包含「系統履約單號」一欄；檔名自動使用箱號及重量，例如 box1-9kg.xlsx。空箱不匯出。": ["One Excel file per box, containing only the fulfillment number column. Named by box and weight (e.g. box1-9kg.xlsx). Empty boxes are skipped.", "Eine Excel-Datei je Karton, nur mit Fulfillmentnummern. Dateiname aus Karton und Gewicht (z. B. box1-9kg.xlsx). Leere Kartons werden übersprungen."], "箱": ["boxes", "Kartons"], "件": ["items", "Pakete"], "掃描中": ["SCANNING", "AKTIV"], "未填重量": ["No weight", "Kein Gewicht"], "此箱尚無包裹，請掃描條碼加入": ["No parcels yet. Scan a barcode to add one.", "Noch keine Pakete. Zum Hinzufügen Barcode scannen."], "指定運單號 (MAIL NO.)": ["Tracking No. (MAIL NO.)", "Sendungsnummer (MAIL NO.)"], "系統履約單號": ["Fulfillment Number", "Fulfillmentnummer"], "刪": ["Del.", "Löschen"], "尚無箱子資料": ["No boxes yet", "Noch keine Kartons"], "掃描或輸入指定運單號 (按 Enter 加入)": ["Scan or enter tracking number (press Enter)", "Sendungsnummer scannen/eingeben (Enter)"], "已載入": ["Loaded", "Geladen"], "筆對照資料": ["mapping records", "Zuordnungen"], "查無對應單號": ["No matching number", "Keine Zuordnung"], "未上傳對照表": ["Mapping not uploaded", "Keine Zuordnungstabelle"], "已匹配": ["Matched", "Zugeordnet"], "未匹配": ["Unmatched", "Nicht zugeordnet"], "裝箱明細對照表": ["Box Details", "Kartondetails"], "各箱重量統計": ["Box Weight Summary", "Gewichtsübersicht"], "箱號 (BOX)": ["Box (BOX)", "Karton (BOX)"], "箱重 (kg)": ["Weight (kg)", "Gewicht (kg)"], "比對狀態": ["Match Status", "Abgleichstatus"], "掃描時間": ["Scan Time", "Scanzeit"], "件數 (Parcels)": ["Parcels", "Pakete"], "重量 (kg)": ["Weight (kg)", "Gewicht (kg)"]};
        let currentLanguage = localStorage.getItem('work_toolkit_language') || localStorage.getItem('warehouse_language') || 'en';
        function t(value) {
            const entry = TRANSLATIONS[value];
            return currentLanguage === 'zh' || !entry ? value : entry[currentLanguage === 'en' ? 0 : 1];
        }
        function translatePage(root = document.body) {
            const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
            const nodes = [];
            while (walker.nextNode()) nodes.push(walker.currentNode);
            for (const node of nodes) {
                if (node.parentElement?.closest('script,style,option')) continue;
                const original = node.__originalText ?? node.textContent;
                node.__originalText = original;
                const trimmed = original.trim();
                if (TRANSLATIONS[trimmed]) node.textContent = original.replace(trimmed, t(trimmed));
            }
            root.querySelectorAll('[placeholder]').forEach(el => {
                const orig = el.dataset.originalPlaceholder || el.getAttribute('placeholder');
                el.dataset.originalPlaceholder = orig;
                el.setAttribute('placeholder', t(orig));
            });
            document.documentElement.lang = ({zh:'zh-TW',en:'en',de:'de'})[currentLanguage];
        }
        function setLanguage(lang) {
            if (!['zh','en','de'].includes(lang)) return;
            currentLanguage = lang;
            localStorage.setItem('work_toolkit_language', lang);
             localStorage.setItem('warehouse_language', lang);
             localStorage.setItem('lp_pdf_language', lang);
            document.getElementById('language-select').value = lang;
            translatePage();
            const exportText = {
                zh: ['一鍵打包下載全部報表（ZIP）','一次下載：Excel 裝箱總表、PDF 裝箱報表，以及各箱獨立的 VO 相容 Excel（sheet1 / 系统履约单号）。空箱不匯出。'],
                en: ['Download all reports (ZIP)','One download: Excel packing summary, PDF packing report, and VO-compatible Excel per box (sheet1 / 系统履约单号). Empty boxes are skipped.'],
                de: ['Alle Berichte herunterladen (ZIP)','Ein Download: Excel-Gesamtübersicht, PDF-Packbericht und VO-kompatible Excel-Datei je Karton (sheet1 / 系统履约单号). Leere Kartons werden übersprungen.']
            };
            document.getElementById('export-all-label').textContent = exportText[lang][0];
            document.getElementById('export-all-description').textContent = exportText[lang][1];
            const back = document.getElementById("back-to-tools");
            back.title = t("返回工具列表");
            back.setAttribute("aria-label", t("返回工具列表"));
            renderBoxes();
            const status = document.getElementById('excel-status');
            if (lookupCount > 0) status.textContent = ({zh:`已載入 ${lookupCount} 筆對照資料`,en:`Loaded ${lookupCount} mapping records`,de:`${lookupCount} Zuordnungen geladen`})[lang];
            else status.textContent = t('尚未載入對照表');
            updateHeaderStats();
        }

        let lookupMap = {};
        let lookupCount = 0;

        let boxes = JSON.parse(localStorage.getItem('warehouse_boxes') || '[]');
        let activeBoxIndex = 0;

        let html5QrCode = null;
        let isScanning = false;
        let lastScannedCode = '';
        let lastScannedTime = 0;

        window.addEventListener('DOMContentLoaded', () => {
            if (boxes.length === 0) {
                boxes.push({ id: Date.now(), name: 'BOX 001', weight: '', items: [] });
            }
            activeBoxIndex = boxes.length - 1;
            syncInputsWithActiveBox();
            setLanguage(currentLanguage);
        });

        function saveState() {
            localStorage.setItem('warehouse_boxes', JSON.stringify(boxes));
            updateHeaderStats();
        }

        function updateHeaderStats() {
            const totalBoxes = boxes.length;
            const totalParcels = boxes.reduce((sum, b) => sum + b.items.length, 0);
            document.getElementById('header-stats').innerText = currentLanguage === 'zh' ? `${totalBoxes} 箱 / ${totalParcels} 件` : currentLanguage === 'en' ? `${totalBoxes} boxes / ${totalParcels} items` : `${totalBoxes} Kartons / ${totalParcels} Pakete`;
        }

        function handleExcelUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById('file-name-display').innerText = file.name;
            const reader = new FileReader();

            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const rows = XLSX.utils.sheet_to_json(worksheet, { defval: '' });

                    lookupMap = {};
                    lookupCount = 0;

                    rows.forEach(row => {
                        const keys = Object.keys(row);
                        let trackingKey = keys.find(k => k.includes('指定运单号') || k.includes('指定運單號') || k.includes('运单号') || k.includes('運單號'));
                        let fulfillmentKey = keys.find(k => k.includes('系统履约单号') || k.includes('系統履約單號') || k.includes('履约单号') || k.includes('履約單號'));

                        if (!fulfillmentKey && keys.length >= 1) fulfillmentKey = keys[0];
                        if (!trackingKey && keys.length >= 2) trackingKey = keys[1];

                        const trackingVal = String(row[trackingKey] || '').trim();
                        const fulfillmentVal = String(row[fulfillmentKey] || '').trim();

                        if (trackingVal) {
                            lookupMap[trackingVal.toUpperCase()] = fulfillmentVal;
                            lookupCount++;
                        }
                    });

                    boxes.forEach(box => {
                        box.items.forEach(item => {
                            const found = lookupMap[item.tracking.toUpperCase()];
                            if (found !== undefined) {
                                item.fulfillment = found;
                                item.matched = true;
                            }
                        });
                    });

                    saveState();
                    renderBoxes();

                    const statusEl = document.getElementById('excel-status');
                    statusEl.innerText = currentLanguage === 'zh' ? `已載入 ${lookupCount} 筆對照資料` : currentLanguage === 'en' ? `Loaded ${lookupCount} mapping records` : `${lookupCount} Zuordnungen geladen`;
                    statusEl.className = 'text-xs font-bold text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-full';
                } catch (err) {

        function processBarcode(rawCode) {
            const code = String(rawCode || '').trim();
            if (!code) return;

            const inputEl = document.getElementById('barcode-input');
            inputEl.value = '';

            let duplicateBoxName = null;
            for (const b of boxes) {
                if (b.items.some(i => i.tracking.toUpperCase() === code.toUpperCase())) {
                    duplicateBoxName = b.name;
                    break;
                }
            }

            if (duplicateBoxName) {
                playBeep(false);
                showFeedback(message(`⚠️ 重複單號：${code} 已經在「${duplicateBoxName}」中！`,`⚠️ Duplicate: ${code} already in ${duplicateBoxName}!`,`⚠️ Doppelte Nummer: ${code} bereits in ${duplicateBoxName}!`), 'warning');
                return;
            }

            const upperCode = code.toUpperCase();
            const hasLookupData = lookupCount > 0;
            const matchedFulfillment = lookupMap[upperCode];
            const isMatched = matchedFulfillment !== undefined && matchedFulfillment !== '';

            const currentBox = boxes[activeBoxIndex];
            currentBox.items.push({
                tracking: code,
                fulfillment: isMatched ? matchedFulfillment : (hasLookupData ? '查無對應單號' : '未上傳對照表'),
                matched: isMatched,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })
            });

            saveState();
            renderBoxes();

            if (isMatched) {
                playBeep(true);
                showFeedback(message(`✅ 成功加入 [${currentBox.name}]：${code} → ${matchedFulfillment}`,`✅ Added to [${currentBox.name}]: ${code} → ${matchedFulfillment}`,`✅ Zu [${currentBox.name}] hinzugefügt: ${code} → ${matchedFulfillment}`), 'success');
            } else if (hasLookupData) {
                playBeep(false);
                showFeedback(message(`⚠️ 已加入 [${currentBox.name}]，但 Excel 中找不到對應履約單號！`,`⚠️ Added to [${currentBox.name}], but no matching fulfillment number found!`,`⚠️ Zu [${currentBox.name}] hinzugefügt, aber keine Fulfillmentnummer gefunden!`), 'warning');
            } else {
                playBeep(true);
                showFeedback(message(`📦 已加入 [${currentBox.name}]：${code}`,`📦 Added to [${currentBox.name}]: ${code}`,`📦 Zu [${currentBox.name}] hinzugefügt: ${code}`), 'info');
            }
        }

        function showFeedback(msg, type) {
            const el = document.getElementById('scan-feedback');
            el.classList.remove('hidden', 'bg-emerald-50', 'text-emerald-800', 'border-emerald-200', 'bg-amber-50', 'text-amber-800', 'border-amber-200', 'bg-blue-50', 'text-blue-800', 'border-blue-200');
            el.classList.add('border');

            if (type === 'success') {
                el.classList.add('bg-emerald-50', 'text-emerald-800', 'border-emerald-200');
            } else if (type === 'warning') {
                el.classList.add('bg-amber-50', 'text-amber-800', 'border-amber-200');
            } else {
                el.classList.add('bg-blue-50', 'text-blue-800', 'border-blue-200');
            }
            el.innerHTML = `<span>${msg}</span>`;
        }

        function playBeep(success) {
            if (navigator.vibrate) navigator.vibrate(success ? 80 : [100, 50, 100]);
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.frequency.value = success ? 880 : 320;
                osc.type = 'sine';
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                osc.start();
                osc.stop(ctx.currentTime + (success ? 0.1 : 0.25));
            } catch (e) {}
        }

        function startScanner() {
            document.getElementById('scanner-wrapper').classList.remove('hidden');
            document.getElementById('start-scan-btn').classList.add('hidden');

            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }

            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 260, height: 140 } },
                (decodedText) => {
                    const now = Date.now();
                    if (decodedText === lastScannedCode && now - lastScannedTime < 1500) return;
                    lastScannedCode = decodedText;
                    lastScannedTime = now;

                    processBarcode(decodedText);

                    if (!document.getElementById('continuous-scan').checked) {
                        stopScanner();
                    }
                },
                () => {}
            ).catch(err => {
                alert(message('無法開啟相機，請確認相機權限。','Cannot open camera. Check permissions.','Kamera kann nicht geöffnet werden. Berechtigungen prüfen.'));
                stopScanner();
            });
            isScanning = true;
        }

        function stopScanner() {
            if (html5QrCode && isScanning) {
                html5QrCode.stop().then(() => {
                    isScanning = false;
                    document.getElementById('scanner-wrapper').classList.add('hidden');
                    document.getElementById('start-scan-btn').classList.remove('hidden');
                }).catch(() => {});
            } else {
                document.getElementById('scanner-wrapper').classList.add('hidden');
                document.getElementById('start-scan-btn').classList.remove('hidden');
            }
        }

        async function exportBoxesToZip() {
            const filledBoxes = boxes.filter(box => box.items.length > 0);
            if (filledBoxes.length === 0) {
                alert(message('目前沒有任何掃描記錄可匯出！','No scanned records to export.','Keine Scandaten zum Exportieren vorhanden.'));
                return;
            }
            if (typeof JSZip === 'undefined' || typeof XLSX === 'undefined') {
                alert(message('Excel 或 ZIP 函式庫尚未載入，請檢查網路連線後重新整理頁面。','Excel or ZIP library unavailable. Check your connection and reload.','Excel- oder ZIP-Bibliothek nicht geladen. Verbindung prüfen und neu laden.'));
                return;
            }

            const zip = new JSZip();
            const usedNames = new Set();
            let unmatchedCount = 0;
            filledBoxes.forEach((box, index) => {
                // 僅輸出有效匹配的系統履約單號，避免把提示文字當成單號。
                const values = box.items
                    .filter(item => item.matched && item.fulfillment &&
                        !['查無對應單號', '未上傳對照表'].includes(String(item.fulfillment)))
                    .map(item => [String(item.fulfillment)]);
                unmatchedCount += box.items.length - values.length;

                const sheet = XLSX.utils.aoa_to_sheet([['系统履约单号'], ...values]);
                sheet['!cols'] = [{ wch: 28 }];
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, sheet, 'sheet1');
                const bytes = XLSX.write(workbook, { bookType: 'xlsx', type: 'array' });

                const boxName = String(box.name || `box${index + 1}`)
                    .trim().replace(/\s+/g, '').replace(/[\\/:*?"<>|\x00-\x1f]/g, '_');
                const weightNumber = Number(box.weight);
                const weight = box.weight !== '' && Number.isFinite(weightNumber) && weightNumber >= 0
                    ? String(weightNumber) : '未填重量';
                const base = `${boxName}-${weight}kg`;
                let filename = `${base}.xlsx`;
                let suffix = 2;
                while (usedNames.has(filename.toLowerCase())) {
                    filename = `${base}-${suffix++}.xlsx`;
                }
                usedNames.add(filename.toLowerCase());
                zip.file(filename, bytes);
            });

            if (unmatchedCount > 0 && !confirm(message(`有 ${unmatchedCount} 筆未匹配單號，分箱 Excel 將略過這些資料。仍要匯出嗎？`,`${unmatchedCount} unmatched records will be skipped. Continue exporting?`,`${unmatchedCount} nicht zugeordnete Einträge werden übersprungen. Export fortsetzen?`))) return;

            try {
                const blob = await zip.generateAsync({ type: 'blob' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                const date = new Date();
                const dateStr = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
                link.download = `boxes-excel-${dateStr}.zip`;
                document.body.appendChild(link);
                link.click();
                link.remove();
                setTimeout(() => URL.revokeObjectURL(url), 60000);
            } catch (error) {
                console.error(error);
                alert(message('分箱 Excel 匯出失敗，請重試。','Box Excel export failed. Please try again.','Excel-Export je Karton fehlgeschlagen. Bitte erneut versuchen.'));
            }
        }

                const wsDetail = XLSX.utils.json_to_sheet(detailRows);
                const wsSummary = XLSX.utils.json_to_sheet(summaryRows);
                wsDetail['!cols'] = [{wch:14},{wch:12},{wch:24},{wch:24},{wch:12},{wch:14}];
                wsSummary['!cols'] = [{wch:16},{wch:16},{wch:14}];
                XLSX.utils.book_append_sheet(wb,wsDetail,'裝箱明細對照表');
                XLSX.utils.book_append_sheet(wb,wsSummary,'各箱重量統計');
                zip.file(`packed-list-${dateStr}.xlsx`, XLSX.write(wb,{bookType:'xlsx',type:'array'}));

                const usedNames = new Set();
                let unmatchedCount = 0;
                const boxFolder = zip.folder('boxes');
                filledBoxes.forEach((box,index) => {
                    const values = box.items.filter(item => item.matched && item.fulfillment &&
                        !['查無對應單號','未上傳對照表'].includes(String(item.fulfillment)))
                        .map(item => [String(item.fulfillment)]);
                    unmatchedCount += box.items.length - values.length;
                    const sheet = XLSX.utils.aoa_to_sheet([['系统履约单号'], ...values]);
                    sheet['!cols'] = [{wch:28}];
                    const book = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(book,sheet,'sheet1');
                    const boxName = String(box.name || `box${index+1}`).trim().replace(/\s+/g,'').replace(/[\\/:*?"<>|\x00-\x1f]/g,'_');
                    const weightNumber = Number(box.weight);
                    const weight = box.weight !== '' && Number.isFinite(weightNumber) && weightNumber >= 0 ? String(weightNumber) : '未填重量';
                    const base = `${boxName}-${weight}kg`;
                    let filename = `${base}.xlsx`, suffix=2;
                    while (usedNames.has(filename.toLowerCase())) filename=`${base}-${suffix++}.xlsx`;
                    usedNames.add(filename.toLowerCase());
                    boxFolder.file(filename,XLSX.write(book,{bookType:'xlsx',type:'array'}));
                });
                if (unmatchedCount && !confirm(message(
                    `有 ${unmatchedCount} 筆未匹配單號，分箱 Excel 將略過這些資料（總表及 PDF 仍保留）。繼續嗎？`,
                    `${unmatchedCount} unmatched records will be omitted from box Excel files (but retained in the summary and PDF). Continue?`,
                    `${unmatchedCount} nicht zugeordnete Einträge werden in Karton-Excel-Dateien ausgelassen (in Gesamtbericht und PDF bleiben sie erhalten). Fortfahren?`
                ))) return;

                // Render the exact existing report markup, without opening the print dialog.
                const report = exportToPDF(true);
                temporary = document.createElement('div');
                // A4 printable width: 210mm - 2 x 10mm = 190mm (~718px at 96dpi).
                // Use 700px to leave extra room for font rendering differences.
                temporary.style.cssText = 'position:absolute;left:0;top:0;width:700px;background:white;z-index:-1;pointer-events:none;';
                const copy = report.cloneNode(true);
                copy.classList.remove('hidden','print:block');
                copy.style.cssText = 'display:block;width:700px;max-width:700px;padding:0;margin:0;box-sizing:border-box;background:white;';
                const reportBody = copy.firstElementChild;
                if (reportBody) {
                    reportBody.style.cssText = 'width:100%;max-width:100%;margin:0;box-sizing:border-box;';
                    // Prevent the long heading and totals from widening the report beyond A4.
                    const header = reportBody.firstElementChild;
                    if (header) {
                        header.style.flexWrap = 'wrap';
                        header.style.gap = '12px';
                        Array.from(header.children).forEach(child => {
                            child.style.minWidth = '0';
                            child.style.maxWidth = '100%';
                            child.style.overflowWrap = 'anywhere';
                        });
                    }
                    const footer = reportBody.lastElementChild;
                    if (footer) {
                        footer.style.flexWrap = 'wrap';
                        footer.style.gap = '8px';
                        Array.from(footer.children).forEach(child => {
                            child.style.minWidth = '0';
                            child.style.maxWidth = '100%';
                            child.style.overflowWrap = 'anywhere';
                        });
                    }
                    // Preserve explicit box headers in the exported PDF (not the footer).
                    reportBody.querySelectorAll('.box-report-header').forEach(heading => {
                        heading.style.setProperty('display', 'flex', 'important');
                        heading.style.setProperty('background-color', '#1e293b', 'important');
                        heading.style.setProperty('color', '#ffffff', 'important');
                        heading.style.setProperty('min-height', '42px', 'important');
                        heading.querySelectorAll('span').forEach(span => span.style.setProperty('color', '#ffffff', 'important'));
                    });
                    reportBody.querySelectorAll('table').forEach(table => {
                        table.style.width = '100%';
                        table.style.maxWidth = '100%';
                        table.style.tableLayout = 'fixed';
                        // Set consistent column widths for header and data rows.
                        // A narrow index column avoids wasting a third of the page.
                        const colgroup = document.createElement('colgroup');
                        ['8%', '46%', '46%'].forEach(width => {
                            const col = document.createElement('col');
                            col.style.width = width;
                            colgroup.appendChild(col);
                        });
                        table.insertBefore(colgroup, table.firstChild);
                        table.querySelectorAll('tr').forEach(row => {
                            const cells = row.querySelectorAll('th, td');
                            if (cells.length === 3) {
                                ['20%', '40%', '40%'].forEach((width, i) => {
                                    cells[i].style.width = width;
                                });
                            }
                        });
                        table.querySelectorAll('th,td').forEach(cell => {
                            cell.style.overflowWrap = 'anywhere';
                            cell.style.wordBreak = 'break-word';
                        });
                    });
                }
                temporary.appendChild(copy);
                document.body.appendChild(temporary);
                const pdfBlob = await html2pdf().set({
                    margin: [10,10,10,10],
                    filename: `packing-report-${dateStr}.pdf`,
                    image: {type:'jpeg',quality:0.98},
                    html2canvas: {scale:2,useCORS:true,scrollY:0},
                    jsPDF: {unit:'mm',format:'a4',orientation:'portrait'},
                    pagebreak: {mode:['css','legacy'],avoid:'.page-break-avoid'}
                }).from(copy).outputPdf('blob');
                zip.file(`packing-report-${dateStr}.pdf`,pdfBlob);
                const blob = await zip.generateAsync({type:'blob'});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href=url;
                a.download=`warehouse-all-reports-${dateStr}.zip`;
                document.body.appendChild(a);a.click();a.remove();
                setTimeout(()=>URL.revokeObjectURL(url),60000);
            } catch (error) {
                console.error(error);
                alert(message('報表打包失敗：','Report ZIP failed: ','ZIP-Erstellung fehlgeschlagen: ')+error.message);
            } finally {
                if (temporary) temporary.remove();
                label.textContent = oldLabel;
                btn.disabled = false;
            }
        }

        function message(zh, en, de) {
            return currentLanguage === 'en' ? en : currentLanguage === 'de' ? de : zh;
        }
        function escapeHtml(str) {
            return String(str || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }
    </script>
</body>
</html>
