5;text-decoration:none}</style><style id="toolkit-unified-design">

</style></head><body><main class="wrap"><nav class="toolkit-nav" aria-label="Tool navigation"><div class="toolkit-nav-left"><span class="toolkit-nav-globe" aria-hidden="true">🌐</span><select id="toolkit-vo-lang" class="toolkit-nav-select" aria-label="Language / Sprache" onchange="toolkitVoLanguage(this.value)"><option value="zh-CN">简体中文</option><option value="zh">繁體中文</option><option value="en">English</option><option value="de">Deutsch</option></select></div><a class="toolkit-nav-back" href="./index.html" id="toolkit-vo-back">← 返回工具列表</a></nav><div class="top"><div><h1>📊 VO 订单明细 → ERP Angebot 转换工具</h1><p>上传 VO 后台导出的 Excel，自动生成符合公司 ERP 导入模板的 Excel。文件名不限。</p></div></div><section class="card"><h3>① 上传 VO 订单明细 Excel</h3><label id="drop" class="drop" for="file"><strong>📄 点击选择或拖拽 Excel 文件到这里</strong><span>支持 .xlsx / .xls / .csv（单次一个文件）</span><input id="file" type="file" accept=".xlsx,.xls,.csv"></label><p id="filename" class="hint">尚未选择文件</p></section><section class="card"><h3>② ERP 固定信息</h3><div class="row"><div class="field"><label for="customer">customer</label><input id="customer" type="text" value="Taobao Tmall Germany GmbH (TOF)"></div><div class="field"><label for="address">Lieferadresse</label><input id="address" type="text" value="COSCO FRA_Cainiao"></div></div><p class="hint">默认值来自你提供的 ERP 模板；如后续客户或收货仓库变化，可在转换前修改。</p><div class="actions"><button id="convert" disabled>转换并检查资料</button><button id="export" disabled>⬇ 下载 ERP Angebot Excel</button><button id="reset" class="secondary">清空</button></div><div id="message" class="msg">等待上传 VO Excel。</div></section><section class="card"><h3>③ 转换预览</h3><p id="count" class="hint">尚无转换资料</p><div class="tablewrap"><table id="preview"><thead></thead><tbody></tbody></table></div><p><small>仅显示前 30 行。导出的 Excel 包含全部有效数据，表名为 Tabelle1，六个表头与 ERP 模板一致。缺失必需字段的记录会提示且阻止下载，避免漏单。</small></p></section></main><script>
const HEAD=['customer','Lieferadresse','Auftragsreferenz','Order Lines/Product','order_line/product_uom_qty','order_line/unit price'];
const REQUIRED=['系统履约单号','指定运单号','SKU','商品数量','商品单价'];
let source=null, output=null, sourceName='';
const $=id=>document.getElementById(id);
function message(t,kind=''){const e=$('message');e.textContent=t;e.className='msg '+kind}
function clean(v){return v==null?'':String(v).trim()}
function numberValue(v){if(typeof v==='number')return v;let s=clean(v).replace(/\s/g,'').replace(/,/g,'.');return s===''?NaN:Number(s)}
function setFile(f){output=null;$('export').disabled=true;$('count').textContent='尚无转换资料';$('preview').querySelector('thead').replaceChildren();$('preview').querySelector('tbody').replaceChildren();if(!f)return;if(!/\.(xlsx|xls|csv)$/i.test(f.name)){message('请选择 Excel 或 CSV 文件。','error');return}source=f;sourceName=f.name;$('filename').textContent='已选择：'+f.name;$('convert').disabled=false;message('已选择文件，点击「转换并检查资料」。')}
$('file').addEventListener('change',e=>setFile(e.target.files[0]));
const drop=$('drop');for(const ev of ['dragenter','dragover'])drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over')});for(const ev of ['dragleave','drop'])drop.addEventListener(ev=>{ev.preventDefault();drop.classList.remove('over')});drop.addEventListener('drop',e=>{let f=e.dataTransfer.files[0];if(f)setFile(f)});
function preview(rows){let head=$('preview').querySelector('thead'),body=$('preview').querySelector('tbody');head.replaceChildren();body.replaceChildren();let tr=document.createElement('tr');for(const h of HEAD){let th=document.createElement('th');th.textContent=h;tr.appendChild(th)}head.appendChild(tr);for(const row of rows.slice(0,30)){let tr=document.createElement('tr');for(const val of row){let td=document.createElement('td');td.textContent=val;tr.appendChild(td)}body.appendChild(tr)}}
$('convert').onclick=async()=>{if(!source){message('请先上传 VO 订单明细 Excel。','error');return}message('正在读取 Excel 并检查资料，请稍候……');$('convert').disabled=true;try{if(typeof XLSX==='undefined'){throw Error('Excel 读取组件未加载，请检查网络并刷新页面。')}let wb=XLSX.read(await source.arrayBuffer(),{type:'array',raw:true});let raw=[],headerIndex=-1;for(const sheetName of wb.SheetNames){const sheet=wb.Sheets[sheetName];if(!sheet)continue;const candidate=XLSX.utils.sheet_to_json(sheet,{header:1,defval:'',raw:true});const found=candidate.findIndex(r=>Array.isArray(r)&&r.some(c=>clean(c)==='系统履约单号')&&r.some(c=>clean(c)==='SKU'));if(found>=0){raw=candidate;headerIndex=found;break}}if(headerIndex<0)throw Error('找不到 VO 订单明细表头（系统履约单号、SKU）。已检查所有工作表。请确认上传的是包含完整订单明细的 Excel，而不是仅有单号的一列表格。');let headers=raw[headerIndex].map(clean),index=k=>headers.indexOf(k);let missing=REQUIRED.filter(k=>index(k)<0);if(missing.length)throw Error('VO 文件缺少必需列：'+missing.join('、'));let rows=[],errors=[];for(let i=headerIndex+1;i<raw.length;i++){let r=raw[i];if(!r||r.every(c=>clean(c)===''))continue;let get=k=>r[index(k)],scp=clean(get('系统履约单号')),lp=clean(get('指定运单号')),sku=clean(get('SKU')),qty=numberValue(get('商品数量')),price=numberValue(get('商品单价'));let issues=[];if(!scp)issues.push('系统履约单号');if(!lp)issues.push('指定运单号');if(!sku)issues.push('SKU');if(!Number.isFinite(qty)||qty<=0)issues.push('商品数量');if(!Number.isFinite(price)||price<0)issues.push('商品单价');if(issues.length){errors.push(`第 ${i+1} 行：${issues.join('、')} 无效或缺失`);continue}rows.push([clean($('customer').value),clean($('address').value),scp+'+'+lp,sku,qty,price])}if(!rows.length)throw Error('没有可转换的有效订单。'+(errors.length?'\n'+errors.slice(0,15).join('\n'):''));if(!clean($('customer').value)||!clean($('address').value))throw Error('customer 和 Lieferadresse 不可为空');preview(rows);$('count').textContent=`有效订单明细 ${rows.length} 行；异常 ${errors.length} 行。`;if(errors.length){output=null;$('export').disabled=true;message(`检测到 ${errors.length} 行异常，为避免漏单已禁止导出。请修改源文件后重新上传：\n`+errors.slice(0,30).join('\n')+(errors.length>30?'\n……其余异常未显示':''),'error');return}output=rows;$('export').disabled=false;message(`转换成功：${rows.length} 行。已按 ERP 模板生成六列，可下载 Excel。`,'good')}catch(e){output=null;$('export').disabled=true;message('转换失败：'+(e?.message||String(e)),'error')}finally{$('convert').disabled=false}};
$('export').onclick=()=>{if(!output)return;let ws=XLSX.utils.aoa_to_sheet([HEAD,...output]);ws['!cols']=[{wch:40},{wch:24},{wch:48},{wch:32},{wch:27},{wch:24}];for(let i=1;i<=output.length;i++){let c=ws['C'+(i+1)],d=ws['D'+(i+1)];if(c){c.t='s';c.z='@'}if(d){d.t='s';d.z='@'}}let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Tabelle1');let date=new Date(),d=[date.getFullYear(),String(date.getMonth()+1).padStart(2,'0'),String(date.getDate()).padStart(2,'0')].join('-');XLSX.writeFile(wb,'VO-ERP-Angebot-'+d+'.xlsx')};
$('reset').onclick=()=>{source=null;output=null;sourceName='';$('file').value='';$('filename').textContent='尚未选择文件';$('convert').disabled=true;$('export').disabled=true;$('count').textContent='尚无转换资料';$('preview').querySelector('thead').replaceChildren();$('preview').querySelector('tbody').replaceChildren();message('等待上传 VO Excel。')};
</script><script id="toolkit-step-normalizer">
/* Decorative step badges only. Reapplies after language changes without changing IDs or events. */
(function(){
  const symbols={'①':'1','②':'2','③':'3','④':'4','⑤':'5','⑥':'6','⑦':'7','⑧':'8','⑨':'9'};
  let working=false;
  function refresh(){
    if(working)return;working=true;
    try{
      document.querySelectorAll('main h2,main h3,.card h2,.card h3,.panel h2,.panel h3').forEach(h=>{
        if(h.querySelector(':scope > .toolkit-step-number'))return;
        const node=Array.from(h.childNodes).find(n=>n.nodeType===3&&n.nodeValue.trim());
        if(!node)return;
        const t=node.nodeValue;
        const m=t.match(/^(\s*)([①②③④⑤⑥⑦⑧⑨]|[1-9][.．、])\s*/);
        if(!m)return;
        const number=symbols[m[2]]||m[2][0];
        const badge=document.createElement('span');badge.className='toolkit-step-number';badge.setAttribute('aria-hidden','true');badge.textContent=number;
        node.nodeValue=t.slice(m[0].length);
        h.insertBefore(badge,node);
      });
    }finally{working=false;}
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',refresh,{once:true});else refresh();
  // Translation code can replace heading textContent; reapply number styling then.
  const observer=new MutationObserver(mutations=>{
    if(working)return;
    if(mutations.some(m=>m.type==='characterData'||(m.type==='childList'&&Array.from(m.addedNodes).some(n=>n.nodeType===3))))refresh();
  });
  const start=()=>observer.observe(document.body,{subtree:true,childList:true,characterData:true});
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();
})();
</script>

'zh':['← 返回工具列表','📊 VO 訂單明細 → ERP Angebot 轉換工具','上傳 VO 後台匯出的 Excel，自動產生符合公司 ERP 匯入範本的 Excel。檔名不限。','① 上傳 VO 訂單明細 Excel','② ERP 固定資訊','③ 轉換預覽','轉換並檢查資料','⬇ 下載 ERP Angebot Excel','清空'],
'en':['← Back to tools','📊 VO Order Details → ERP Angebot Converter','Upload an Excel export from VO and convert it to the company ERP import format. Any file name is accepted.','① Upload VO order details Excel','② ERP fixed information','③ Conversion preview','Convert and validate','⬇ Download ERP Angebot Excel','Clear'],
'de':['← Zur Werkzeugübersicht','📊 VO-Bestelldetails → ERP-Angebot Konverter','VO-Excel-Datei hochladen und in das ERP-Importformat umwandeln. Der Dateiname ist beliebig.','① VO-Bestelldetails hochladen','② ERP-Stammdaten','③ Vorschau','Konvertieren und prüfen','⬇ ERP-Angebot Excel herunterladen','Zurücksetzen']};
function toolkitVoLanguage(lang){const v=VO_UI[lang]||VO_UI['zh-CN'];const q=x=>document.querySelector(x);const targets=['#toolkit-vo-back','.top h1','.top p','section.card:nth-of-type(1) h3','section.card:nth-of-type(2) h3','section.card:nth-of-type(3) h3','#convert','#export','#reset'];targets.forEach((sel,i)=>{const e=q(sel);if(e)e.textContent=v[i]});q('#toolkit-vo-lang').value=lang;document.documentElement.lang=lang==='zh'?'zh-TW':lang;try{localStorage.setItem('work_toolkit_language',lang)}catch(e){}}
(function(){let lang='zh-CN';try{lang=localStorage.getItem('work_toolkit_language')||lang}catch(e){}toolkitVoLanguage(lang)})();
</script></body></html>
