<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VO 订单明细 → ERP Angebot 转换工具</title><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>*{box-sizing:border-box}body{font-family:system-ui,'Microsoft YaHei',sans-serif;background:#f1f5f9;color:#14213b;margin:0;padding:24px}.wrap{max-width:1100px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:24px;margin:8px 0}p,.hint{color:#64748b}.card{background:white;border:1px solid #d9e2ef;border-radius:16px;padding:24px;margin-top:20px;box-shadow:0 3px 12px #172b4d08}.drop{border:2px dashed #a9bdd7;background:#f8fbff;border-radius:12px;padding:35px 16px;text-align:center;cursor:pointer}.drop.over{background:#dbeafe;border-color:#2563eb}.drop strong{display:block;margin-bottom:8px}.drop input{display:none}.row{display:flex;gap:14px;flex-wrap:wrap;align-items:end}.field{flex:1;min-width:240px}.field label{display:block;font-size:13px;margin-bottom:7px;color:#475569}input[type=text]{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px}button{background:#4f46e5;color:white;border:0;border-radius:9px;padding:12px 20px;font-weight:650;cursor:pointer}button:disabled{background:#a5b4fc;cursor:not-allowed}.secondary{background:#e2e8f0;color:#1e293b}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.msg{white-space:pre-wrap;padding:12px;border-radius:9px;background:#eef2ff;margin-top:15px}.error{background:#fff1f2;color:#9f1239}.good{background:#ecfdf5;color:#065f46}.tablewrap{overflow:auto;max-height:420px;margin-top:16px;border:1px solid #e2e8f0;border-radius:8px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{border-bottom:1px solid #e2e8f0;padding:10px;text-align:left;white-space:nowrap}th{position:sticky;top:0;background:#e9eef7}small{color:#64748b}a{color:#334155;text-decoration:none}</style></head><body><main class="wrap"><div class="top"><div><h1>📊 VO 订单明细 → ERP Angebot 转换工具</h1><p>上传 VO 后台导出的 Excel，自动生成符合公司 ERP 导入模板的 Excel。文件名不限。</p></div><a href="./index.html">← 返回工具列表</a></div><section class="card"><h3>① 上传 VO 订单明细 Excel</h3><label id="drop" class="drop" for="file"><strong>📄 点击选择或拖拽 Excel 文件到这里</strong><span>支持 .xlsx / .xls / .csv（单次一个文件）</span><input id="file" type="file" accept=".xlsx,.xls,.csv"></label><p id="filename" class="hint">尚未选择文件</p></section><section class="card"><h3>② ERP 固定信息</h3><div class="row"><div class="field"><label for="customer">customer</label><input id="customer" type="text" value="Taobao Tmall Germany GmbH (TOF)"></div><div class="field"><label for="address">Lieferadresse</label><input id="address" type="text" value="COSCO FRA_Cainiao"></div></div><p class="hint">默认值来自你提供的 ERP 模板；如后续客户或收货仓库变化，可在转换前修改。</p><div class="actions"><button id="convert" disabled>转换并检查资料</button><button id="export" disabled>⬇ 下载 ERP Angebot Excel</button><button id="reset" class="secondary">清空</button></div><div id="message" class="msg">等待上传 VO Excel。</div></section><section class="card"><h3>③ 转换预览</h3><p id="count" class="hint">尚无转换资料</p><div class="tablewrap"><table id="preview"><thead></thead><tbody></tbody></table></div><p><small>仅显示前 30 行。导出的 Excel 包含全部有效数据，表名为 Tabelle1，六个表头与 ERP 模板一致。缺失必需字段的记录会提示且阻止下载，避免漏单。</small></p></section></main><script>
const HEAD=['customer','Lieferadresse','Auftragsreferenz','Order Lines/Product','order_line/product_uom_qty','order_line/unit price'];
const REQUIRED=['系统履约单号','指定运单号','SKU','商品数量','商品单价'];
let source=null, output=null, sourceName='';
const $=id=>document.getElementById(id);
function message(t,kind=''){const e=$('message');e.textContent=t;e.className='msg '+kind}
function clean(v){return v==null?'':String(v).trim()}
function numberValue(v){if(typeof v==='number')return v;let s=clean(v).replace(/\s/g,'').replace(/,/g,'.');return s===''?NaN:Number(s)}
function setFile(f){output=null;$('export').disabled=true;if(!f)return;if(!/\.(xlsx|xls|csv)$/i.test(f.name)){message('请选择 Excel 或 CSV 文件。','error');return}source=f;sourceName=f.name;$('filename').textContent='已选择：'+f.name;$('convert').disabled=false;message('已选择文件，点击「转换并检查资料」。')}
$('file').addEventListener('change',e=>setFile(e.target.files[0]));
const drop=$('drop');for(const ev of ['dragenter','dragover'])drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over')});for(const ev of ['dragleave','drop'])drop.addEventListener(ev=>{ev.preventDefault();drop.classList.remove('over')});drop.addEventListener('drop',e=>{let f=e.dataTransfer.files[0];if(f)setFile(f)});
function preview(rows){let head=$('preview').querySelector('thead'),body=$('preview').querySelector('tbody');head.replaceChildren();body.replaceChildren();let tr=document.createElement('tr');for(const h of HEAD){let th=document.createElement('th');th.textContent=h;tr.appendChild(th)}head.appendChild(tr);for(const row of rows.slice(0,30)){let tr=document.createElement('tr');for(const val of row){let td=document.createElement('td');td.textContent=val;tr.appendChild(td)}body.appendChild(tr)}}
$('convert').onclick=async()=>{if(!source)return;if(typeof XLSX==='undefined'){message('Excel 组件尚未加载，请检查网络后刷新页面。','error');return}try{let wb=XLSX.read(await source.arrayBuffer(),{type:'array',raw:true});let sheet=wb.Sheets[wb.SheetNames[0]];if(!sheet)throw Error('Excel 没有可读取的工作表');let raw=XLSX.utils.sheet_to_json(sheet,{header:1,defval:'',raw:true});let headerIndex=raw.findIndex(r=>r.some(c=>clean(c)==='系统履约单号')&&r.some(c=>clean(c)==='SKU'));if(headerIndex<0)throw Error('未找到 VO 订单明细表头（系统履约单号、SKU）。请确认上传的是 VO 导出的订单明细。');let headers=raw[headerIndex].map(clean),index=k=>headers.indexOf(k);let missing=REQUIRED.filter(k=>index(k)<0);if(missing.length)throw Error('VO 文件缺少必需列：'+missing.join('、'));let rows=[],errors=[];for(let i=headerIndex+1;i<raw.length;i++){let r=raw[i];if(!r||r.every(c=>clean(c)===''))continue;let get=k=>r[index(k)],scp=clean(get('系统履约单号')),lp=clean(get('指定运单号')),sku=clean(get('SKU')),qty=numberValue(get('商品数量')),price=numberValue(get('商品单价'));let issues=[];if(!scp)issues.push('系统履约单号');if(!lp)issues.push('指定运单号');if(!sku)issues.push('SKU');if(!Number.isFinite(qty)||qty<=0)issues.push('商品数量');if(!Number.isFinite(price)||price<0)issues.push('商品单价');if(issues.length){errors.push(`第 ${i+1} 行：${issues.join('、')} 无效或缺失`);continue}rows.push([clean($('customer').value),clean($('address').value),scp+'+'+lp,sku,qty,price])}if(!rows.length)throw Error('没有可转换的有效订单。'+(errors.length?'\n'+errors.slice(0,15).join('\n'):''));if(!clean($('customer').value)||!clean($('address').value))throw Error('customer 和 Lieferadresse 不可为空');preview(rows);$('count').textContent=`有效订单明细 ${rows.length} 行；异常 ${errors.length} 行。`;if(errors.length){output=null;$('export').disabled=true;message(`检测到 ${errors.length} 行异常，为避免漏单已禁止导出。请修改源文件后重新上传：\n`+errors.slice(0,30).join('\n')+(errors.length>30?'\n……其余异常未显示':''),'error');return}output=rows;$('export').disabled=false;message(`转换成功：${rows.length} 行。已按 ERP 模板生成六列，可下载 Excel。`,'good')}catch(e){output=null;$('export').disabled=true;message('转换失败：'+e.message,'error')}};
$('export').onclick=()=>{if(!output)return;let ws=XLSX.utils.aoa_to_sheet([HEAD,...output]);ws['!cols']=[{wch:40},{wch:24},{wch:48},{wch:32},{wch:27},{wch:24}];for(let i=1;i<=output.length;i++){let c=ws['C'+(i+1)],d=ws['D'+(i+1)];if(c){c.t='s';c.z='@'}if(d){d.t='s';d.z='@'}}let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Tabelle1');let date=new Date(),d=[date.getFullYear(),String(date.getMonth()+1).padStart(2,'0'),String(date.getDate()).padStart(2,'0')].join('-');XLSX.writeFile(wb,'VO-ERP-Angebot-'+d+'.xlsx')};
$('reset').onclick=()=>{source=null;output=null;sourceName='';$('file').value='';$('filename').textContent='尚未选择文件';$('convert').disabled=true;$('export').disabled=true;$('count').textContent='尚无转换资料';$('preview').querySelector('thead').replaceChildren();$('preview').querySelector('tbody').replaceChildren();message('等待上传 VO Excel。')};
</script></body></html>
