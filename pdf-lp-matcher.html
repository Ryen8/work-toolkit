<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LP 單號 PDF 自動配對合併工具</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>*{box-sizing:border-box}body{margin:0;background:#f1f5f9;font:15px system-ui,'Microsoft JhengHei',sans-serif;color:#1e293b}.wrap{max-width:920px;margin:30px auto;padding:0 16px}h1{font-size:25px;margin:0 0 8px}.sub{color:#64748b;margin-bottom:24px}.card{background:white;border:1px solid #e2e8f0;border-radius:15px;padding:22px;margin:14px 0;box-shadow:0 2px 8px #0f172a08}h2{font-size:17px;margin:0 0 16px}.inputs{display:grid;grid-template-columns:1fr 1fr;gap:14px}.upload{border:2px dashed #cbd5e1;padding:16px;border-radius:12px;background:#f8fafc}.upload b{display:block;margin-bottom:10px}.upload input{max-width:100%;width:100%}.upload small{display:block;color:#64748b;margin-top:8px}button{border:0;border-radius:10px;background:#2563eb;color:white;padding:12px 18px;font-weight:700;cursor:pointer}button:disabled{background:#94a3b8;cursor:not-allowed}.secondary{background:#0f766e}.controls{display:flex;gap:10px;flex-wrap:wrap}.hint{font-size:13px;color:#64748b;line-height:1.65}progress{width:100%;height:13px}#log{font:12px/1.6 monospace;white-space:pre-wrap;background:#0f172a;color:#d1fae5;border-radius:10px;padding:12px;max-height:170px;overflow:auto}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{padding:10px 14px;border-radius:10px;background:#f1f5f9;font-weight:700}.stat span{display:block;color:#64748b;font-weight:400;font-size:12px}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:9px;text-align:left;border-bottom:1px solid #e2e8f0}th{background:#f8fafc}#result{display:none}.warn{color:#b45309}.good{color:#047857}.scroll{max-height:330px;overflow:auto}@media(max-width:620px){.inputs{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>📄 LP 單號 PDF 自動配對合併工具</h1><div class="sub">依 LP 單號配對物流面單與倉庫出庫單，匹配頁相鄰排列，未匹配頁保留於末尾。</div>
<div class="card"><h2>① 上傳兩份 PDF</h2><div class="inputs"><label class="upload"><b>物流面單 PDF（document.pdf）</b><input id="labels" type="file" accept="application/pdf,.pdf"><small>識別 Mail No.: LP...（支援 PDF 文字）</small></label><label class="upload"><b>倉庫出庫單 PDF（Packvorgänge.pdf）</b><input id="packing" type="file" accept="application/pdf,.pdf"><small>識別 Order 條碼下方的 LP...（影像 OCR）</small></label></div></div>
<div class="card"><h2>② 分析並配對</h2><div class="controls"><button id="analyze" onclick="analyze()">開始識別及比對</button><button id="download" class="secondary" onclick="exportPdf()" disabled>下載整理好的 PDF</button></div><p class="hint">每組輸出順序：物流面單 → 相同 LP 的出庫單。若有多頁相同 LP，會全部保留。未匹配的物流面單與出庫單依原頁碼放到最後。原始 PDF 頁面不重新排版。處理在瀏覽器本機完成；首次使用需要網路載入 PDF/OCR 函式庫。</p><progress id="progress" value="0" max="100"></progress><div id="status" class="hint">等待上傳檔案</div><div id="log" aria-live="polite">尚未開始</div></div>
<div class="card" id="result"><h2>③ 比對結果</h2><div id="stats" class="stats"></div><p class="hint warn" id="warning"></p><div class="scroll"><table><thead><tr><th>LP 單號</th><th>物流面單頁</th><th>出庫單頁</th><th>狀態</th></tr></thead><tbody id="rows"></tbody></table></div></div>
</div><script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
let context=null;
const $=id=>document.getElementById(id);const lpRegex=/LP\s*0\s*\d{11,17}/ig;
function normalized(s){return String(s||'').replace(/[^A-Za-z0-9]/g,'').toUpperCase()}
function extractLP(s){let m=String(s||'').replace(/[\u200b\u200c]/g,'').match(lpRegex);return m?normalized(m[0]):null}
function log(s){$('log').textContent+='\n'+s;$('log').scrollTop=$('log').scrollHeight}
function progress(v,s){$('progress').value=v;$('status').textContent=s}
async function getText(page){const content=await page.getTextContent();return content.items.map(x=>x.str).join(' ')}
async function cropOCR(page,worker){const vp=page.getViewport({scale:3});const c=document.createElement('canvas');c.width=Math.ceil(vp.width);c.height=Math.ceil(vp.height);const ctx=c.getContext('2d',{willReadFrequently:true});await page.render({canvasContext:ctx,viewport:vp}).promise;
// Order barcode caption appears at approximately x=40..205, y=290..320 on A4 pages.
const regions=[[35,282,220,325],[30,260,270,350],[25,230,320,410]];
for(const [x1,y1,x2,y2] of regions){const box=document.createElement('canvas');box.width=Math.round((x2-x1)*3);box.height=Math.round((y2-y1)*3);box.getContext('2d').drawImage(c,x1*3,y1*3,box.width,box.height,0,0,box.width,box.height);
const {data}=await worker.recognize(box);const text=normalized(data.text);const m=text.match(/LP0\d{11,17}/);if(m)return m[0];}
return null}
async function analyze(){const fa=$('labels').files[0],fb=$('packing').files[0];if(!fa||!fb){alert('請先選擇兩份 PDF');return} $('analyze').disabled=true;$('download').disabled=true;$('result').style.display='none';$('log').textContent='開始分析';let worker=null;
try{if(!window.pdfjsLib||!window.PDFLib||!window.Tesseract)throw Error('函式庫載入失敗，請確認網路連線。');const a=new Uint8Array(await fa.arrayBuffer()),b=new Uint8Array(await fb.arrayBuffer());const [docA,docB]=await Promise.all([pdfjsLib.getDocument({data:a.slice()}).promise,pdfjsLib.getDocument({data:b.slice()}).promise]);const labels=[],packing=[];
for(let i=1;i<=docA.numPages;i++){const p=await docA.getPage(i);let lp=extractLP(await getText(p));labels.push({page:i,lp});progress(i/docA.numPages*35,`物流面單：${i}/${docA.numPages}`);log(`物流面單 第${i}頁：${lp||'未識別'}`)}
progress(36,'初始化 OCR，準備讀取出庫單條碼下方編號');worker=await Tesseract.createWorker('eng');await worker.setParameters({tessedit_char_whitelist:'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789',preserve_interword_spaces:'0'});
for(let i=1;i<=docB.numPages;i++){const p=await docB.getPage(i);let lp=extractLP(await getText(p));if(!lp)lp=await cropOCR(p,worker);packing.push({page:i,lp});progress(35+i/docB.numPages*60,`出庫單 OCR：${i}/${docB.numPages}`);log(`出庫單 第${i}頁：${lp||'未識別（可保留至最後）'}`)}
const packMap=new Map();for(const p of packing)if(p.lp){if(!packMap.has(p.lp))packMap.set(p.lp,[]);packMap.get(p.lp).push(p.page)}
const usedB=new Set(),order=[],rows=[];let match=0;
for(const l of labels){const pages=(l.lp?packMap.get(l.lp):null)||[];const available=pages.filter(n=>!usedB.has(n));if(available.length){order.push({source:'a',page:l.page});for(const n of available){order.push({source:'b',page:n});usedB.add(n)}match++;rows.push({lp:l.lp,a:l.page,b:available.join(', '),status:'已匹配'})}else rows.push({lp:l.lp||'未識別',a:l.page,b:'—',status:'物流面單未匹配'})}
// Move all unmatched label pages to the end, then all unmatched packing pages.
const matchedA=new Set(rows.filter(r=>r.status==='已匹配').map(r=>r.a));for(const l of labels)if(!matchedA.has(l.page))order.push({source:'a',page:l.page});for(const p of packing)if(!usedB.has(p.page)){order.push({source:'b',page:p.page});rows.push({lp:p.lp||'未識別',a:'—',b:p.page,status:'出庫單未匹配'})}
context={a,b,order};$('result').style.display='block';$('stats').innerHTML=`<div class="stat">${docA.numPages}<span>物流面單頁</span></div><div class="stat">${docB.numPages}<span>出庫單頁</span></div><div class="stat">${match}<span>成功配對組</span></div><div class="stat">${docA.numPages-match+docB.numPages-usedB.size}<span>未匹配頁</span></div>`;
$('rows').innerHTML=rows.map(r=>`<tr><td>${r.lp}</td><td>${r.a}</td><td>${r.b}</td><td class="${r.status==='已匹配'?'good':'warn'}">${r.status}</td></tr>`).join('');$('warning').textContent='OCR 辨識可能受字體與掃描品質影響，請先核對表格中的 LP 號與頁碼，再匯出。';$('download').disabled=false;progress(100,`分析完成：成功配對 ${match} 組，輸出 ${order.length} 頁`);
}catch(e){log('錯誤：'+e.message);progress(0,'分析失敗：'+e.message)}finally{if(worker)await worker.terminate();$('analyze').disabled=false}}
async function exportPdf(){if(!context)return;const btn=$('download');btn.disabled=true;try{progress(0,'正在合併 PDF 頁面');const out=await PDFLib.PDFDocument.create();const [a,b]=await Promise.all([PDFLib.PDFDocument.load(context.a),PDFLib.PDFDocument.load(context.b)]);for(let i=0;i<context.order.length;i++){const x=context.order[i];const src=x.source==='a'?a:b;const [page]=await out.copyPages(src,[x.page-1]);out.addPage(page);if(i%3===0)progress((i+1)/context.order.length*95,`合併中：${i+1}/${context.order.length}`)}const bytes=await out.save();const blob=new Blob([bytes],{type:'application/pdf'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='LP_配對整理_'+new Date().toISOString().slice(0,10)+'.pdf';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);progress(100,'PDF 已產生，請查看下載資料夾')}catch(e){alert('匯出失敗：'+e.message)}finally{btn.disabled=false}}
</script></body></html>
